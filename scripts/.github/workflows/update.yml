name: 每天更新影片清單

on:
  schedule:
    - cron: "0 16 * * *"   # UTC 16:00 = 台北 00:00
  workflow_dispatch:        # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取 YouTube 播放清單
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/update.py
      - name: 有變動就存檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          if git diff --cached --quiet; then
            echo "沒有新影片"
          else
            git commit -m "自動更新影片清單 $(TZ=Asia/Taipei date +'%Y-%m-%d')"
            git push
          fi
